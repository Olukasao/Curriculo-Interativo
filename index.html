<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Lucas Soares — Software Developer / Creative Technologist</title>
    <meta name="description" content="Lucas Soares desenvolve software de ponta a ponta — interface, backend e inteligência artificial — e desenha a forma como ele é visto. Projetos: Workscape, AcessaNet, Creative Lab, Kollect." />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Lucas Soares — Code. Design. Intelligence." />
    <meta property="og:description" content="Software developer, full stack developer, graphic designer and creative technologist." />
    <meta property="og:image" content="/og.jpg" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&display=swap"
      rel="stylesheet"
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Lucas Soares",
        "jobTitle": "Software Developer",
        "knowsAbout": ["Full Stack Development", "Artificial Intelligence", "LLM Integration", "AI Agents", "Graphic Design", "Motion Design", "Branding"],
        "sameAs": ["https://github.com/Olukasao", "https://www.behance.net/lucassoares205"]
      }
    </script>
    <script>
      // Decide before first paint whether the intro plays, so the hero never flashes.
      try {
        var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        var seen = sessionStorage.getItem("ls-intro-seen");
        if (!reduce && !seen && location.pathname === "/") document.documentElement.classList.add("intro-pending");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="padding:2rem;font-family:system-ui;color:#ededE8;background:#000">
        Lucas Soares — Software Developer / Creative Technologist. GitHub: github.com/Olukasao · Behance: behance.net/lucassoares205
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
